[package]
name = "code-map"
version = "0.1.0"
edition = "2021"
description = "Query layer over code-parser JSONL maps — refresh, graph edges (callers/callees/path)"
license = "MIT"
repository = "https://github.com/yagaltd/code-parser"
keywords = ["code-parser", "code-map", "retrieval"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "code-map"
path = "src/main.rs"

[dependencies]
code-parser-core = { path = "../code-parser-core" }
code-parser-ir = { path = "../code-parser-ir" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fuzzy-matcher = "0.3"
regex = "1"
blake3 = "1"
ureq = { version = "2", optional = true, default-features = false, features = ["json", "tls"] }

[features]
default = []
all = [
  "code-parser-core/rust",
  "code-parser-core/typescript",
  "code-parser-core/javascript",
  "code-parser-core/python",
]
typesafe = ["dep:ureq"]
typellm = ["dep:ureq"]
