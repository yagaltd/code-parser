[package]
name = "code-parser-cli"
version = "0.1.0"
edition = "2021"
description = "CLI for code-parser — parse, parse-repo, watch"
license = "MIT"
repository = "https://github.com/yagaltd/code-parser"
rust-version = "1.82"
keywords = ["code-parser", "cli", "tree-sitter"]
categories = ["development-tools", "command-line-utilities"]


[dependencies]
code-parser-core = { path = "../code-parser-core" }
code-parser-ir = { path = "../code-parser-ir" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["rust"]
rust = ["code-parser-core/rust"]
typescript = ["code-parser-core/typescript"]
python = ["code-parser-core/python"]
javascript = ["code-parser-core/javascript"]
watcher = ["code-parser-core/watcher"]
