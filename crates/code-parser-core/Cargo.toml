[package]
name = "code-parser-core"
version = "0.1.0"
edition = "2021"
description = "tree-sitter engine for code-parser — parse, extract, resolve"
license = "MIT"
repository = "https://github.com/yagaltd/code-parser"
rust-version = "1.82"
keywords = ["code-parser", "tree-sitter", "parser", "code-analysis"]
categories = ["development-tools", "parser-implementations"]


[dependencies]
code-parser-ir = { path = "../code-parser-ir" }
tree-sitter = "0.25"
blake3 = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"

# Language grammars — one feature per language
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }

# Optional watcher
notify = { version = "7", optional = true }

[dev-dependencies]
pretty_assertions = "1"

[features]
default = ["rust"]
rust = ["dep:tree-sitter-rust"]
typescript = ["dep:tree-sitter-typescript"]
python = ["dep:tree-sitter-python"]
javascript = ["dep:tree-sitter-javascript"]
watcher = ["dep:notify"]
